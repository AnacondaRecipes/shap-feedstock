{% set name = "shap" %}
{% set version = "0.51.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: cfa17ff213657c9d50285aa923d79b0037a62e2ee1a31bc3eec7e196b00bdb59

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<311]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - wheel
    - setuptools >=61.0
    - setuptools-scm >=8.0
    - numpy {{ numpy }}
    - packaging >=20.9
    - cython >=3.0.11
  run:
    - python
    - numpy >=2
    - scipy
    - scikit-learn
    - pandas
    - tqdm >=4.27.0
    - packaging >20.9
    - slicer ==0.0.8
    - numba  # [not (osx or x86_64)]
    - llvmlite  # [not (osx or x86_64)]
    - cloudpickle
    - typing-extensions

{% set deselect_tests = "" %}
# E numpy._core._exceptions._ArrayMemoryError: Unable to allocate 16.4 GiB for an array with shape (2000, 1100000) and data type float64
{% set deselect_tests = " --deselect=tests/explainers/test_tree.py::test_overflow_tree_path_dependent" %}
# E TypeError: only 0-dimensional arrays can be converted to Python scalars
# Known issue with numpy, checked that these tests fail only with numpy>=2.4 and work correctly with numpy<2.4
{% set deselect_tests = deselect_tests + " --deselect=tests/explainers/test_coalition.py::test_tabular_coalition_single_output" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/explainers/test_coalition.py::test_tabular_coalition_exact_match" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/explainers/test_coalition.py::test_tabular_coalition_partition_match" %}
# Flaky on CI: urllib.error.HTTPError: HTTP Error 502: Bad Gateway or Proxy Error
{% set deselect_tests = deselect_tests + " --deselect=tests/test_datasets.py::test_nhanesi" %}

test:
  source_files:
    - tests
  imports:
    - shap
    - shap._explanation
    - shap.benchmark
    - shap.explainers._coalition
    - shap.explainers._explainer
    - shap.explainers._tree
    - shap.explainers.other
    - shap.links
    - shap.maskers
    - shap.models
    - shap.plots
    - shap.plots._force
    - shap.plots._style
    - shap.plots._utils
    - shap.plots.colors
    - shap.utils
    - shap.utils._exceptions
    - shap.utils._masked_model
  commands:
    - pip check
    # OMP: Error #13: Assertion failure at kmp_dispatch.cpp(1298).
    # https://github.com/llvm/llvm-project/issues/54422
    - export OMP_NUM_THREADS=1  # [osx]
    - pytest -sv tests {{ deselect_tests }} --ignore=tests/benchmark
  requires:
    - pip
    - pytest
    - matplotlib-base
    - ipython
    - xgboost
    # pytorch is not available for PY3.14
    - pytorch-cpu  # [py<314]
    - transformers
    # catboost is not available for PY3.14
    - catboost  # [py<314]
    - pyod
    - lightgbm
    - sentencepiece

about:
  home: https://github.com/shap/shap
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A unified approach to explain the output of any machine learning model.
  description: |
    SHAP (SHapley Additive exPlanations) is a unified approach to explain the output
    of any machine learning model. SHAP connects game theory with local explanations,
    uniting several previous methods and representing the only possible consistent and
    locally accurate additive feature attribution method based on expectations.
  doc_url: https://shap.readthedocs.io
  dev_url: https://github.com/shap/shap

extra:
  recipe-maintainers:
    - connortann
    - mrandrewandrade
    - primozgodec
    - slundberg
    - xhochy
  
